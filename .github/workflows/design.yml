name: Design contracts

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - name: Install design-check dependencies
        run: python3 -m pip install -r validation/requirements.txt
      - name: Validate design contracts
        run: make design-check
      - name: Search the admitted domain by property
        run: make design-properties
      - name: Test the harness boundaries
        run: make design-boundary
      - name: Require a clean generated result
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
