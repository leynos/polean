name: Toolchain

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'toolchain-pins.json'
      - 'lean/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'tests/toolchain/**'
      - 'tests/features/**'
      - 'examples/tenant-write/**'
      - 'Makefile'
      - '.github/workflows/toolchain.yml'
  push:
    branches: [main]
    paths:
      - 'toolchain-pins.json'
      - 'lean/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'tests/toolchain/**'
      - 'tests/features/**'
      - 'examples/tenant-write/**'
      - 'Makefile'
      - '.github/workflows/toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run is cancelled so two 628 MiB provisioning jobs
# do not compete for the same cache. A push to main is never cancelled: it is
# the observation of what landed, and runs share a single group there.
concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          rustflags: ''
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - name: Test the provisioning script
        run: |
          python3 -m pip install -r scripts/requirements-test.txt
          make test-scripts
      # The downloads directory holds the verified archives, so a re-run
      # re-extracts without the network. The key covers every pin at once:
      # a pin change deliberately misses the cache and re-downloads.
      - name: Cache verified tool archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .polean/tools/downloads
          key: toolchain-downloads-${{ hashFiles('toolchain-pins.json') }}
      - name: Provision and run the smoke checks
        run: make toolchain-smoke
