# Repository-wide Cargo defaults for the development build standard.
#
# The parallel `rustc` frontend and the Cranelift backend are the defaults for
# every development build, and the mold linker is the default on Linux. Cargo
# auto-discovers this file, so a bare `cargo build` gets all three. Coverage and
# release builds assign `RUSTFLAGS` or select LLVM, which displaces the
# development defaults.
#
# Cargo selects a single `rustflags` source rather than merging them: a
# matching `[target.*]` table replaces `[build] rustflags` outright. Every flag
# is therefore repeated in each source, and the Makefile restates them where it
# assigns `RUSTFLAGS` for the gate targets.

[unstable]
embed-metadata = false
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

[build]
rustflags = ["-Zthreads=8"]

# mold ships for Linux only, so the linker flag lives in a Linux-only table.
# Other platforms fall through to `[build] rustflags` and their default linker.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-Clink-arg=-fuse-ld=mold"]
